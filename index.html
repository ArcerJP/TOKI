<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TOKI | みんなの予定</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c574b'/%3E%3Cpath d='M7 10h18M10 16h12M13 22h12' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">▤</span><strong>TOKI</strong><span class="brand-divider"></span><h1>みんなの予定</h1></div>
      <span id="save-status" role="status">このブラウザーに保存</span>
    </header>
    <section class="toolbar" aria-label="表示と編集">
      <div class="date-tools"><button id="previous" aria-label="前の日">‹</button><label class="sr-only" for="date-select">表示する日</label><select id="date-select"></select><button id="next" aria-label="次の日">›</button><span class="member-count">16人</span></div>
      <div class="actions"><button id="undo" title="元に戻す（Ctrl+Z）" disabled>↶ 元に戻す</button><button id="redo" title="やり直す（Ctrl+Shift+Z）" disabled>↷</button><button id="print-button">PDF出力</button><button id="add-button" class="primary">＋ 予定を追加</button></div>
    </section>
    <div class="chart-caption"><span><i class="legend"></i>参加できる時間<span id="day-summary"></span></span><span>空き枠をドラッグで追加 · 予定をドラッグで移動 · 両端で時間変更</span></div>
    <div id="chart-scroll" class="chart-scroll" aria-label="16人の予定表"><div id="chart" class="chart"></div></div>
    <footer><span>2026年10月3日 — 10月8日</span><span>30分刻みの目盛り／時刻は1分単位で入力可能 · 予定をクリックして編集</span></footer>
    <p class="storage-note">変更はこの端末の同じブラウザーに保存されます。ブラウザーの保存データを削除すると、編集内容も消えます。</p>
  </main>
  <dialog id="event-dialog">
    <form id="event-form">
      <div class="dialog-heading"><h2 id="dialog-title">予定を追加</h2><button type="button" class="icon-button" id="close-dialog" aria-label="閉じる">×</button></div>
      <label for="event-title">タイトル</label><input id="event-title" maxlength="100" placeholder="参加可能" autocomplete="off">
      <div class="form-grid"><div><label for="event-person">名前</label><select id="event-person"></select></div><div><label for="event-date">日にち</label><select id="event-date"></select></div></div>
      <div class="form-grid"><div><label for="event-start">開始</label><input id="event-start" type="time" step="60" required></div><div><label for="event-end">終了</label><input id="event-end" type="time" step="60" required><small>翌0:00は「00:00」</small></div></div>
      <label for="event-detail">詳細</label><textarea id="event-detail" rows="4" maxlength="2000" placeholder="必要なことをメモ"></textarea>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete-button" class="danger">削除</button><span></span><button type="button" id="cancel-dialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
    </form>
  </dialog>
  <dialog id="print-dialog"><form id="print-form"><div class="dialog-heading"><h2>PDF出力</h2><button type="button" id="close-print" class="icon-button" aria-label="閉じる">×</button></div><label for="print-scope">出力する日にち</label><select id="print-scope"><option value="current">表示中の1日</option><option value="all">全6日（1日ごとに改ページ）</option></select><p class="print-help">印刷画面で「PDFに保存」を選択してください。A3・横向きが推奨です。</p><div class="dialog-actions"><span></span><button type="submit" class="primary">印刷画面を開く</button></div></form></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <div id="print-area"></div>
</body>
</html>
